name: Infra (Terraform) + Deploy

# Avvio MANUALE dalla tab "Actions" del repo (dopo aver fatto push del codice).
# Un solo run: applica l'infrastruttura con Terraform e poi pubblica sito + Functions.
# Autenticazione ad Azure via OIDC (nessuna password/secret di lunga durata).
on:
  workflow_dispatch:
    inputs:
      apply_infra:
        description: "Esegui terraform apply (infra). Deseleziona per pubblicare solo il contenuto."
        type: boolean
        default: true

permissions:
  id-token: write # richiesto da OIDC (azure/login)
  contents: read

concurrency:
  group: infra-and-deploy
  cancel-in-progress: false

jobs:
  infra_and_deploy:
    runs-on: ubuntu-latest
    name: Terraform + Static Web Apps
    env:
      # Credenziali OIDC lette dal provider azurerm e dalla azurerm backend.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Login ad Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Assicura lo storage del tfstate nel RG esistente (idempotente): risolve il
      # problema uovo-e-gallina senza il modulo bootstrap. Ricava la chiave e la
      # passa a Terraform via ARM_ACCESS_KEY (mascherata nei log).
      - name: Prepara storage del tfstate
        run: |
          set -euo pipefail
          az storage account create \
            --name "${{ vars.TFSTATE_SA }}" \
            --resource-group "${{ vars.APP_RESOURCE_GROUP }}" \
            --sku Standard_LRS --min-tls-version TLS1_2 \
            --allow-blob-public-access false -o none
          KEY="$(az storage account keys list -g "${{ vars.APP_RESOURCE_GROUP }}" -n "${{ vars.TFSTATE_SA }}" --query '[0].value' -o tsv)"
          echo "::add-mask::$KEY"
          echo "ARM_ACCESS_KEY=$KEY" >> "$GITHUB_ENV"
          az storage container create --name tfstate --account-name "${{ vars.TFSTATE_SA }}" --account-key "$KEY" -o none

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.APP_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=wedding-site.tfstate"

      - name: Terraform apply
        if: ${{ inputs.apply_infra }}
        working-directory: infra
        env:
          TF_VAR_resource_group_name: ${{ vars.APP_RESOURCE_GROUP }}
          TF_VAR_admin_pin: ${{ secrets.ADMIN_PIN }}
          # Opzionali: se la variabile GitHub non è impostata si usa il default del modulo.
          TF_VAR_prefix: ${{ vars.PREFIX || 'smwedding' }}
          TF_VAR_swa_location: ${{ vars.SWA_LOCATION || 'West Europe' }}
          TF_VAR_allowed_origin: ${{ vars.ALLOWED_ORIGIN || '*' }}
        run: terraform apply -auto-approve -input=false

      # Il token di deploy della SWA è un output di Terraform: lo leggiamo qui, così
      # non serve custodirlo come secret del repo.
      - name: Leggi il deployment token della SWA
        id: swa
        working-directory: infra
        run: |
          set -euo pipefail
          TOKEN="$(terraform output -raw swa_api_key)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy del contenuto (sito + Functions)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
