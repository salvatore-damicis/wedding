name: Build e Deploy su Azure Static Web Apps

# L'infrastruttura è creata a mano con Terraform da locale (vedi docs/DEPLOY.md).
# Questo workflow si occupa SOLO di buildare e pubblicare il contenuto (sito +
# Functions) ad ogni push su main, usando il deployment token della SWA salvato
# come secret del repo (AZURE_STATIC_WEB_APPS_API_TOKEN = output `swa_api_key`).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write # per i commenti con le anteprime delle PR

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build e deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Deploy su Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Sito statico multi-pagina alla radice: niente build del frontend.
          # Le Functions in /api vengono buildate dall'azione.
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Chiudi anteprima PR
    steps:
      - name: Chiudi ambiente di anteprima
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
