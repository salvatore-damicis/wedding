<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Luoghi — Salvatore & Martina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-nav"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">I Luoghi</h2>
      <p class="section-subtitle">Due luoghi, una sola giornata: vi aspettiamo in entrambi</p>
      <!-- Cerimonia → trasferimento → ricevimento: l'ordine nel DOM è anche
           l'ordine di lettura su mobile (pila) e su desktop (1fr auto 1fr). -->
      <div class="venues">
        <div class="venue">
          <div class="venue__kicker">La Cerimonia</div>
          <div class="venue__name">Chiesa San Francesco</div>
          <p class="venue__addr">Via Concordia 6, Cesate (MI)<br />ore 11:00</p>
          <a class="btn btn-outline" data-maps="ceremony" target="_blank" rel="noopener">Indicazioni</a>
        </div>

        <!-- Il trasferimento è l'unica informazione che non si deduce da due
             indirizzi: ~75 km tra le due province, oltre un'ora di auto. -->
        <div class="transfer">
          <span class="transfer__body">
            <span class="transfer__icon">
              <svg viewBox="0 0 46 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 19.5v-3a2 2 0 0 1 1.6-2l5.2-1 3.4-3.9A3.6 3.6 0 0 1 18 8.4h8.7c.9 0 1.8.35 2.5.95l4.9 4.2 5.4.95a2 2 0 0 1 1.6 2v3" />
                <path d="M11.8 13.5h21.3" />
                <path d="M5 19.5h3.4M15.2 19.5h11.6M33.6 19.5H41" />
                <circle cx="11.8" cy="19.5" r="3.4" />
                <circle cx="30.2" cy="19.5" r="3.4" />
              </svg>
            </span>
            <span class="transfer__label">circa 1h</span>
          </span>
        </div>

        <div class="venue">
          <div class="venue__kicker">Il Ricevimento</div>
          <div class="venue__name">La Corte e Il Sogno</div>
          <p class="venue__addr">Via Donatelli 3, Trescore Balneario (BG)</p>
          <a class="btn btn-outline" data-maps="reception" target="_blank" rel="noopener">Indicazioni</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/pages/luoghi.js"></script>
</body>
</html>
